services:
  app:
    build: .
    image: node:alpine
    container_name: node-app-prisma
    working_dir: /usr/app
    volumes:
      - .:/usr/app
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
    command: npm run start:dev
  
  postgresql:
    image: postgres
    container_name: postgres-dev-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DATASOURCE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}